[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-hermes-runtime"
version = "0.1.0"
description = "Kairo-owned zero-tool bridge around a pinned Hermes Agent runtime"
requires-python = ">=3.11,<3.14"
dependencies = [
  # PyPI 0.18.2 was published with Trusted Publishing from the same upstream
  # commit previously fetched via VCS: 9de9c25f620ff7f1ce0fd5457d596052d5159596.
  "hermes-agent==0.18.2",
  "fastapi==0.133.1",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
include = ["hermes_runtime", "hermes_runtime.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
