name: Certification
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/certify.yml"
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci --no-audit --no-fund
      - run: npm run preflight
      - name: Live Brand Brain 12-site certification
        env:
          FLOW_1A_LIVE_CERTIFICATION: "1"
        run: npm test --workspace @kairo/api -- src/flow-1a-12-site-certification.live.test.ts
      - run: |
          mkdir -p artifacts
          printf '# Certification\n\n- Exact SHA: %s\n- Result: passed\n' "$GITHUB_SHA" > artifacts/certification-summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: certification-${{ github.sha }}
          path: artifacts/certification-summary.md
