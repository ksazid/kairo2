name: Certification
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/certify.yml"
      - "apps/api/**"
      - "apps/ui/**"
      - "packages/**"
      - "services/**"
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci --no-audit --no-fund
      - run: npm run preflight
      - name: Live Brand Brain 12-site certification
        env:
          FLOW_1A_LIVE_CERTIFICATION: "1"
        run: npm test --workspace @kairo/api -- src/flow-1a-12-site-certification.live.test.ts
      - name: Onboarding to Hunter to Discover journey
        env:
          KAIRO_CHUNK5_FIXTURE_CERTIFICATION: "1"
        run: npm test --workspace @kairo/api -- src/hunter-chunk5-public-url.fixture.test.ts
      - name: Opportunity to content to campaign to insights journey
        run: npm test --workspace @kairo/api -- src/simple-creation-lineage.test.ts src/simple-creation-generation-v1.test.ts src/campaign-api.test.ts src/analytics-api.test.ts
      - run: |
          mkdir -p artifacts
          printf '# Certification\n\n- Exact SHA: %s\n- Result: passed\n' "$GITHUB_SHA" > artifacts/certification-summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: certification-${{ github.sha }}
          path: artifacts/certification-summary.md
